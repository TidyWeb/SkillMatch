# Six fictional demo personas for the "Try a demo profile" buttons and the matcher tests.
# All are invented people. Each has the outward code of its town centre, a full set of skill
# ratings, previous roles with ticked competencies and evidence lines, and a travel mode.
# Skill levels: course (learned on the course) | project (used in a project) | confident.
# A competency mapped to "" is ticked without an evidence line.

personas:
  - id: phd_coventry
    button: PhD researcher, Coventry
    summary: Finished a social policy PhD; strong on research methods and statistics, new to industry.
    profile:
      name: Demo — PhD researcher
      postcode: CV1
      travel: public_transport
      include_remote: true
      max_office_days: 3
      data_years: 0
      qualifications: {ci_diploma: true, degree: phd, other: "MSc Social Research Methods"}
