        qualitative_analysis: project
      roles:
        - archetype: phd_researcher
          title: PhD researcher
          seniority: individual
          years: 4
          competencies:
            research_methods: Designed and ran a three-year mixed-methods study of 1,200 survey respondents and 40 interviews
            analytical_thinking: Built regression models of housing outcomes and tested them against two census datasets
            technical_writing: Wrote a 90,000-word thesis and two peer-reviewed journal articles
            communicating_non_technical: Presented findings to council officers and a residents' group in plain English
            independent_working: Planned and managed my own research timetable for four years with monthly supervision
            project_management: ""
            numerical_confidence: Taught myself multilevel modelling and checked every figure in my thesis tables
            organisation_prioritising: Balanced thesis deadlines with 6 hours a week of teaching
            attention_to_detail: Checked and cleaned survey data from 1,200 respondents before any analysis
            clear_communication: Presented at six academic conferences and wrote plain-English summaries for participants
            stakeholder_management: Negotiated data access with two councils and a housing association
            adaptability_learning: Learned R and then Python mid-PhD to handle larger datasets
            problem_solving_pressure: Rebuilt my analysis in two weeks when a data provider withdrew a dataset
        - archetype: lecturer
          title: Graduate teaching assistant
          seniority: individual
          years: 3
          competencies:
            training_others: Taught weekly statistics seminars to 60 first-year undergraduates
            clear_communication: Explained statistical ideas to students with no maths background
            sector_education: Marked and moderated coursework within university assessment rules

