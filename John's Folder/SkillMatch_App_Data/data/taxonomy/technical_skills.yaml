# DRAFT: for team review
#
# Technical skills that adverts ask for, and how adverts spell them.
#
# Each skill:
#   id              lower_snake_case, never change once used
#   label           what the user sees
#   category        programming | database | bi | spreadsheet | analysis | data_engineering | platform | business_system | ways_of_working | governance
#   course_covered  true if the Code Institute Data Analytics with AI course teaches it
#   variants        advert spellings, matched case-insensitively on whole words
#   variants_cs     advert spellings matched case-sensitively (for words that are also ordinary English, e.g. "Excel")
#   regex           (rare) a Python regular expression, for spellings variants can't express
#   portfolio_idea  for course-covered skills: a small project that turns "learned" into "used in a project"
#
# families: groups of related skills that partly satisfy each other ("partly met").

skills:
  # ---------- programming ----------
  - id: python
    label: Python
    category: programming
    course_covered: true
    variants: [Python, Python 3, Python3]
    portfolio_idea: Clean and analyse a messy public dataset (for example West Midlands bus punctuality) in a Jupyter notebook and publish it on GitHub.
  - id: pandas
    label: pandas
    category: programming
    course_covered: true
    variants: [pandas, dataframes, dataframe]
    portfolio_idea: Use pandas to merge two public datasets (for example ONS population and NHS GP data) and explain one finding.
  - id: numpy
    label: NumPy
    category: programming
    course_covered: true
    variants: [NumPy, numpy]
    portfolio_idea: Write a small NumPy simulation (for example queue waiting times) and chart the results.
  - id: r_language
    label: R
    category: programming
    course_covered: false
    variants: [R programming, RStudio, R Studio, tidyverse, ggplot2, dplyr]
    regex: ['(?<![\w&.-])R(?=\s*(?:[,/);]|\bor\b|\band\b|$)|\s+(?:programming|language|for\b|skills|experience))']
  - id: vba
    label: VBA and macros
    category: programming
    course_covered: false
    variants: [VBA, macros, Excel VBA, Visual Basic]
  - id: sas
    label: SAS
    category: analysis
    course_covered: false
    variants_cs: [SAS]
  - id: spss
    label: SPSS
    category: analysis
    course_covered: false
    variants: [SPSS]
  - id: stata
    label: Stata
    category: analysis
    course_covered: false
    variants: [Stata]

