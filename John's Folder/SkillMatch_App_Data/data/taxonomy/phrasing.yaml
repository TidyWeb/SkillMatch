# DRAFT: for team review
#
# The sentences SkillMatch writes. No AI writes these at runtime: each is a template filled from
# the user's own profile and the advert's requirement.
#
# Placeholders (in braces) are filled by the app:
#   {requirement}  the requirement in our words, e.g. "reporting to senior leadership"
#   {role}         the user's previous role with "a/an", e.g. "a kitchen manager"
#   {evidence}     the user's evidence line turned into "you ran weekly stock reports…"
#   {quote}        the user's evidence line exactly as typed
#   {seniority}    e.g. "manager"
#   {skill}        a technical skill, e.g. "Power BI"
#   {related}      a related skill the user has, e.g. "Tableau"
#   {idea}         a portfolio project idea from technical_skills.yaml
#   {years}        e.g. "2 years"
#   {user_years}   e.g. "no years" or "1 year"
#   {n}            a count
#   {items}        a list, e.g. "SQL, stakeholder management"
#   {signals}      a list of entry signals found in the advert
#
# Keep sentences short, plain and kind. Never use percentages.

answers:
  # Met
  competency_with_evidence: "Requirement: {requirement}. Your evidence: as {role}, {evidence}."
  competency_with_quote: "Requirement: {requirement}. Your evidence from your time as {role}: “{quote}”."
  leadership_with_evidence: "Requirement: {requirement}. Your evidence: as {role} at {seniority} level, {evidence}."
  leadership_without_evidence: "Requirement: {requirement}. Your evidence: you worked as {role} at {seniority} level."
  skill_confident: "Requirement: {skill}. Your evidence: you rate yourself confident in {skill}."
  skill_project: "Requirement: {skill}. Your evidence: you have used {skill} in a project."
  skill_project_needs_experience: "Requirement: {skill}. Partly met: you have used {skill} in a project, and the advert asks for hands-on work experience of it."
  # Partly met
  skill_course_only: "Requirement: {skill}. Partly met: you learned {skill} on the course. A small project using it would make this a clear match."
  skill_related: "Requirement: {skill}. Partly met: you know {related}, which is closely related."
  competency_without_evidence: "Requirement: {requirement}. Partly met: you ticked this for your time as {role}. Add one line of evidence to make it count."

gaps:
  course_skill_not_ticked: "{skill}: you met this on the course but haven't ticked it. A portfolio project would help: {idea}"
  skill: "{skill}: not in your profile yet."
  competency: "{requirement}: not in your profile yet. If your past work included it, tick it under a previous role and add a line of evidence."
  sector: "{requirement}: the advert wants experience in this sector."

reasons:
  all_essentials_answered: "Your profile answers every essential requirement we could read in this advert."
  essential_gaps: "Essential requirements not yet in your profile ({n}): {items}."
  essential_partly: "Essential requirements only partly met ({n}): {items}."
  no_essentials_found: "We couldn't find clearly essential requirements in this advert, so read it in full before applying."
  few_essentials_found: "We could only find {n} clearly essential requirement in this advert, so we won't call it a strong fit. Read it in full before applying."
  data_years_waived: "It asks for {years} in a data role, but it also welcomes entry-level applicants or equivalent experience."
  data_years_small_gap: "It asks for {years} in a data role and you have {user_years}; that's a small gap."
  data_years_stretch: "It asks for {years} in a data role and you have {user_years}."
  data_years_not_yet: "It asks for {years} in a data role and you have {user_years}; that's a big gap for now."
  degree_warning: "It asks for a degree and doesn't mention equivalent experience."
  entry_signals: "Signs it is open to newcomers: {signals}."
  desirable_answered: "You also answer {n} of its desirable requirements."

tiers:
  strong: Strong fit
  good: Good fit
  stretch: Stretch
  not_yet: Not yet
