# DRAFT: for team review
#
# Previous careers ("archetypes") and the competencies each one typically evidences.
# When a user picks an archetype, or types a job title that fuzzy-matches one, the app proposes
# these competencies. The user then ticks only the ones that are true for them and can add
# one line of evidence each.
#
# Each archetype:
#   id                lower_snake_case, never change once used
#   label             what the user sees
#   aliases           other job titles people type for this career (used for fuzzy matching)
#   competencies      ids from competencies.yaml, most characteristic first
#   example_evidence  one realistic evidence line, written as the user would ("Ran …", "Led …")
#
# See docs/taxonomy_review_guide.md for how to review this file.

archetypes:
  - id: phd_researcher
    label: PhD researcher or postdoc
    aliases: [PhD student, doctoral researcher, postdoctoral researcher, research fellow, research associate, postdoc]
    competencies: [research_methods, analytical_thinking, technical_writing, communicating_non_technical, independent_working, project_management, numerical_confidence, training_others, organisation_prioritising, clear_communication, stakeholder_management]
    example_evidence: Designed and ran a three-year survey study of 1,200 participants and published the results in two journals.
