    phrases: [senior stakeholders, senior leaders, senior leadership, senior management, senior managers, senior decision-makers, board report*, board papers, reports for ... senior, trustees, executive team, executive-level, executive reporting, leadership team*, management reports, reporting ... to management, findings to management, governance committees, steering committees, the board]
