# DRAFT: for team review
#
# Transferable competencies that adverts ask for, and the advert phrases that signal them.
# A previous career "evidences" a competency (see role_archetypes.yaml); an advert requirement
# "asks for" it when one of these phrases appears in the requirement sentence.
#
# Each competency:
#   id           lower_snake_case, never change once used
#   label        what the user sees ("Requirement: <label>")
#   category     core | sector
#   description  plain English, one sentence, for users and reviewers
#   phrases      advert wording that signals it. Matching ignores capitals and works on whole words.
#   not_phrases  (optional) wording that cancels it, e.g. "data warehousing" is not warehouse work.
#                  *    the word can continue:  "stakeholder*" matches stakeholders, stakeholder's
#                  ...  up to four words in between:  "present ... findings" matches "present your key findings"
#
# Phrases come from the live Reed sample (docs/advert_patterns.md). Prefer two- or three-word
# phrases over single words: "lead" alone would match "a leading organisation".

competencies:
  - id: stakeholder_management
    label: stakeholder management
    category: core
    description: Building working relationships with the people who use or depend on your work, and keeping them informed and on side.
    phrases: [stakeholder*, work with individuals at all levels, communicate at all levels, build* ... relationships, relationship building, liaising with, liaise with, cross-functional teams, business partnering, partnering with, gain buy-in, influenc*]
  - id: communicating_non_technical
    label: explaining findings to non-technical audiences
    category: core
    description: Turning numbers and analysis into clear messages that people without a technical background understand and act on.
    phrases: [non-technical, explain complex, explain ... complex information, present complex information, present* ... data, easy to absorb, easy to understand, insights and recommendations, clear commercial insight*, communicate insights, communicate findings, communicate ... findings, present* ... findings, translate* ... into, actionable insight*, actionable recommendations, tell* ... story, data storytelling, presenting information, presentations, summarise and communicate]
  - id: clear_communication
    label: clear written and verbal communication
