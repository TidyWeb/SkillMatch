[project]
name = "skillmatch"
version = "0.0.1"
description = "Matches career-changers' skills to entry-level data roles in the West Midlands."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Tidy Web" }]
# What the web app needs at runtime (and all the container installs).
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "gunicorn>=22.0",
]

[dependency-groups]
# The ETL pipeline: installed locally by default, left out of the web image.
etl = [
    "pandas>=2.2",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "jupyter>=1.0",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[tool.uv]
default-groups = ["etl", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# The formatter keeps code within line-length; long strings and regexes are left alone.
ignore = ["E501"]
