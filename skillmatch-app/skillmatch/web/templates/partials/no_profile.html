<div class="panel">
  {% if missing_data %}
  <h2>No vacancy data yet</h2>
  <p>The database hasn't been built. Run <code>make fixtures</code> (no keys needed) or <code>make etl-live</code>.</p>
  {% else %}
  <h2>Start with your profile</h2>
  <p>We couldn't read a profile from this tab. <a href="{{ url_for('web.profile') }}">Build your profile</a>.</p>
  {% endif %}
</div>
